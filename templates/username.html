<!DOCTYPE html>
<html>
<head>
    <title>Start Survey</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background: #ffffff;
            padding: 40px 50px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 30px;
        }

        label {
            font-size: 1.2rem;
            color: #555;
            display: block;
            margin-bottom: 10px;
        }

        input[type="text"] {
            font-size: 1rem;
            padding: 10px;
            width: 80%;
            max-width: 300px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background-color: #007bff;
            color: #ffffff;
            padding: 10px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to the Personality Traits Survey</h1>
        <form method="POST" action="/">
            <label for="username">Enter your name to start:</label>
            <input type="text" id="username" name="username" required oninput="this.value = this.value.trim()">
            <button type="submit">Start Survey</button>
        </form>
    </div>
</body>
</html>
