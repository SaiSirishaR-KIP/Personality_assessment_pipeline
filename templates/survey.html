<!DOCTYPE html>
<html>
<head>
    <title>Personality Traits Survey</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
            background-color: #f9f9f9;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #333;
        }

        form {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .question-container {
            margin-bottom: 30px;
        }

        label {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 10px;
            display: block;
        }

        input[type="range"] {
            width: 100%;
            margin-top: 10px;
        }

        .scale-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #555;
            margin-top: 5px;
        }

        button {
            display: block;
            margin: 20px auto 0;
            background-color: #007bff;
            color: #ffffff;
            padding: 10px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Personality Traits Survey</h1>
    <form method="post" action="/survey">
        {% for question in questions %}
            <div class="question-container">
                <label>{{ question }}</label>
                <input type="range" name="question_{{ loop.index0 }}" min="1" max="5" value="3">
                <div class="scale-labels">
                    <span>Very Inaccurate</span>
                    <span>Moderately Inaccurate</span>
                    <span>Neither</span>
                    <span>Moderately Accurate</span>
                    <span>Very Accurate</span>
                </div>
            </div>
        {% endfor %}
        <input type="hidden" name="username" value="{{ username }}">
        <input type="hidden" name="page" value="{{ current_page }}">
        <button type="submit">{% if current_page < total_pages %}Next{% else %}Submit{% endif %}</button>
    </form>
</body>
</html>
