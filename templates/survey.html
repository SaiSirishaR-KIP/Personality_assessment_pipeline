<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personality Survey</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background-color: #f8f9fa; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); display: inline-block; width: 50%; }
        .question { margin-bottom: 30px; text-align: left; }
        .slider-container { display: flex; flex-direction: column; align-items: center; }
        .slider { width: 90%; margin: 10px 0; }
        .labels { display: flex; justify-content: space-between; width: 90%; font-size: 12px; color: gray; }
        button { padding: 10px 20px; background: blue; color: white; border: none; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1><strong>Personality Traits Survey</strong></h1>
        <form method="POST">
            {% for question in questions %}
                <div class="question">
                    <label>{{ question }}</label>
                    <div class="slider-container">
                        <input type="range" class="slider" name="q{{ loop.index0 }}" min="1" max="5" value="3" step="1">
                        <div class="labels">
                            <span>Very Inaccurate</span>
                            <span>Moderately Inaccurate</span>
                            <span>Neither</span>
                            <span>Moderately Accurate</span>
                            <span>Very Accurate</span>
                        </div>
                    </div>
                </div>
            {% endfor %}
            <button type="submit">{% if page < total_pages %}Next{% else %}Submit{% endif %}</button>
        </form>
    </div>
</body>
</html>
