<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personality Traits Survey</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 750px;
            width: 100%;
            margin: 50px auto;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0px 6px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2rem;
            font-weight: bold;
        }

        .page-info {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1rem;
            color: #777;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .question-container {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        label {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        /* SLIDER STYLING */
        input[type="range"] {
            width: 100%;
            appearance: none;
            -webkit-appearance: none;
            height: 8px;
            border-radius: 5px;
            background: linear-gradient(to right, #007bff 50%, #ddd 50%);
            outline: none;
            transition: background 0.2s;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            height: 8px;
            border-radius: 5px;
            background: transparent;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #007bff;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            margin-top: -5px;
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: #007bff;
            border-radius: 50%;
            cursor: pointer;
        }

        .scale-labels {
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
            color: #555;
            margin-top: 5px;
        }

        .button-container {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        button {
            background-color: #007bff;
            color: #ffffff;
            padding: 14px 30px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:focus {
            outline: none;
        }

        .back-button {
            background-color: #6c757d;
        }

        .back-button:hover {
            background-color: #545b62;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Personality Traits Survey</h1>
        <div class="page-info">
            Page {{ page }} of {{ total_pages }}
        </div>

        <form method="POST" action="{{ url_for('survey', page=page) }}">
            <input type="hidden" name="username" value="{{ session['username'] }}">
            <input type="hidden" name="page" value="{{ page }}">

            {% for i in range(questions|length) %}
            {% set question_index = ((page-1) * QUESTIONS_PER_PAGE) + i %}
            <div class="question-container">
                <label for="question_{{ question_index }}">{{ questions[i] }}</label>

                <input 
                    type="range" 
                    id="question_{{ question_index }}" 
                    name="q{{ question_index }}"  
                    min="1" 
                    max="5" 
                    step="1"
                    value="{{ previous_responses.get('q' ~ question_index, '3') }}"
                    required
                    oninput="updateSlider(this)">

                <div class="scale-labels">
                    <span>Very Inaccurate</span>
                    <span>Moderately Inaccurate</span>
                    <span>Neither</span>
                    <span>Moderately Accurate</span>
                    <span>Very Accurate</span>
                </div>
            </div>
            {% endfor %}

            <div class="button-container">
                {% if page > 1 %}
                    <a href="{{ url_for('survey', page=page-1) }}">
                        <button type="button" class="back-button">Back</button>
                    </a>
                {% endif %}
                
                <button type="submit">
                    {% if page < total_pages %}Next{% else %}Submit{% endif %}
                </button>
            </div>
        </form>
    </div>

    <script>
        function updateSlider(slider) {
            let percentage = ((slider.value - slider.min) / (slider.max - slider.min)) * 100;
            slider.style.background = `linear-gradient(to right, #007bff ${percentage}%, #ddd ${percentage}%)`;
        }

        // Initialize sliders on page load
        document.addEventListener("DOMContentLoaded", function() {
            document.querySelectorAll('input[type="range"]').forEach(slider => {
                updateSlider(slider);
            });
        });
    </script>
</body>
</html>
